<!DOCTYPE html>

<body>
<div class="wrap">
<h1>ソロアカデミー 中学理科</h1>
<p>このページは、中学理科のすべてを説明するものではありません。<br>
各単元の「大事なところ」だけを取り出して、短い問題と解説にまとめました。<br>
内容をしぼっているので、勉強が苦手な人も、時間がない人も、最後までやりきりやすくなっています。<br>
まず問題を解いて、そのあとに解説を読んでください。学校の勉強に取り組むための、最初の一歩として使ってください。</p>
<h2>中学1年</h2>
<ul class="list" id="list"></ul>
<p class="note">単元は順次増やしていきます。</p>
<footer>ソロアカデミー</footer>
</div>
<script src="data/units.js"></script>
<script>
var ul=document.getElementById("list");
(window.UNITS||[]).forEach(function(u){
  var li=document.createElement("li"),a=document.createElement("a");
  a.href="unit.html?u="+u.id;a.textContent=u.no+"　"+u.title;
  li.appendChild(a);ul.appendChild(li);
});
</script>
</body>
</html>
